<title>Have your say</title>
<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.desc{color:var(--dim);margin:0 0 18px;white-space:pre-line}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px}
.q{font-weight:700;margin:0 0 8px}.req{color:var(--bad)}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
label.opt input{margin-top:4px;accent-color:var(--accent)}
label.opt span{min-width:0;flex:1}.pimg{display:block;width:100%;max-width:420px;max-height:260px;object-fit:contain;border-radius:8px;margin:0 0 6px;background:#f1f1f1}.rimg{width:44px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:8px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
.rate{display:flex;gap:8px}.rate label{flex:1}.rate input{position:absolute;opacity:0}
.rate span{display:block;text-align:center;padding:11px 0;border:1px solid var(--line);border-radius:10px;font-weight:700;cursor:pointer}
.rate input:checked+span{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.rate input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
button.go{width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:800;padding:14px;cursor:pointer;margin-top:6px}
button.go:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.thanks{text-align:center;padding:26px 18px}.thanks h2{margin:0 0 6px}.ref{display:inline-block;margin-top:10px;font:700 18px ui-monospace,Menlo,monospace;background:var(--soft);padding:6px 12px;border-radius:8px}
.foot{text-align:center;color:var(--dim);font-size:12.5px;margin-top:22px}
.qa{border-top:1px solid var(--line);padding:12px 0}.qa:first-child{border-top:0}.qa b{display:block}.qa p{margin:4px 0 0;color:var(--dim)}
.hint{font-size:13.5px;color:var(--dim);margin:0 0 8px}
</style>
</head>
<body>
